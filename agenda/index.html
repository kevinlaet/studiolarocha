<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio La Rocha · Agendar</title>
<meta name="description" content="Agende seu horário no Studio La Rocha, em Mauá (SP): escolha a profissional, o serviço, o dia e a hora.">
<meta name="theme-color" content="#F7F1E8">
<link rel="icon" href="../img/simbolo.svg" type="image/svg+xml">
<link rel="preload" href="../fonts/montserrat-sub.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Cormorant';src:url(../fonts/cormorant-sub.woff2) format('woff2');font-weight:500 600;font-display:swap}
@font-face{font-family:'Great Vibes';src:url(../fonts/greatvibes-sub.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Montserrat';src:url(../fonts/montserrat-sub.woff2) format('woff2');font-weight:400 800;font-display:swap}
:root{
  --creme:#F7F1E8;--papel:#FFFCF7;--ouro:#B08D57;--ouro-c:#D9BC86;--ouro-e:#8E6E3E;--tinta:#2B2622;--tinta-2:#6A6058;--bronze:#9C7A45;--escuro:#1F1A17;--marfim:#F4EBDD;
  --vidro:rgba(255,252,247,.62);--borda:rgba(176,141,87,.28);
  --brilho:linear-gradient(100deg,#8E6E3E 0%,#C9A468 30%,#F1DEB4 48%,#C9A468 66%,#8E6E3E 100%);
  color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--creme);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:Montserrat,system-ui,sans-serif;color:var(--tinta);text-align:center;position:relative;overflow-x:hidden;isolation:isolate;background:var(--creme);
 padding:calc(36px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom))}

/* fundo: luzes douradas lentas + grade fina que some nas bordas */
.fundo{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fundo i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:flutua 18s ease-in-out infinite alternate}
.fundo i:nth-child(1){width:340px;height:340px;background:#EAD3A6;top:-120px;left:-90px}
.fundo i:nth-child(2){width:300px;height:300px;background:#F3E3C6;top:30%;right:-140px;animation-delay:-6s}
.fundo i:nth-child(3){width:280px;height:280px;background:#E7CFA2;bottom:-120px;left:10%;animation-delay:-12s}
.fundo:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(156,122,69,.22) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 22%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 70% 55% at 50% 22%,#000 20%,transparent 80%)}

main{max-width:430px;margin:0 auto}
.entra{opacity:0;transform:translateY(14px);animation:entra .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--o,0) * 70ms + 80ms)}

.selo{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ouro-e);padding:8px 14px 8px 12px;border-radius:99px;border:1px solid var(--borda);background:var(--vidro);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--ouro);animation:pulso 2.4s infinite}

/* logo dentro de um anel dourado que gira devagar, com brilhinhos */
.marca{position:relative;width:168px;height:168px;margin:26px auto 0;display:grid;place-items:center}
.anel{position:absolute;inset:0;border-radius:50%;padding:1.5px;background:conic-gradient(from 0deg,transparent 0 12%,#C9A468 25%,#F1DEB4 32%,#C9A468 40%,transparent 55% 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:gira 9s linear infinite}
.disco{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,var(--papel) 60%,#F4EBDD);box-shadow:0 18px 40px rgba(142,110,62,.18),inset 0 0 0 1px rgba(176,141,87,.18)}
.marca img{position:relative;width:86px;height:auto}
.faisca{position:absolute;width:10px;height:10px;color:#C9A468;animation:pisca 3.2s ease-in-out infinite}
.faisca svg{width:100%;height:100%;display:block}
.faisca.a{top:10px;right:16px}
.faisca.b{bottom:22px;left:4px;width:7px;height:7px;animation-delay:-1.1s}
.faisca.c{top:46px;left:-4px;width:6px;height:6px;animation-delay:-2.2s}

h1{font-family:Cormorant,Georgia,serif;font-weight:500;font-size:clamp(24px,7.2vw,30px);letter-spacing:.2em;padding-left:.2em;margin-top:22px;white-space:nowrap}
.frase{font-family:'Great Vibes',cursive;font-size:clamp(28px,8.4vw,34px);line-height:1.25;background:var(--brilho);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:reflexo 6s ease-in-out infinite}
.local{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;letter-spacing:.05em;color:var(--tinta-2);margin:10px 0 24px}
.local svg{width:14px;height:14px}

/* o que você encontra aqui */
.titulo{font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);margin:4px 0 12px;display:flex;align-items:center;gap:12px}
.titulo:before,.titulo:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--borda))}
.titulo:after{transform:scaleX(-1)}
.servicos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.servicos a{display:flex;align-items:center;gap:10px;padding:11px 10px;text-align:left;min-width:0;border-radius:18px;text-decoration:none;color:var(--tinta);background:var(--vidro);border:1px solid var(--borda);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-weight:700;font-size:12.5px;line-height:1.25;transition:transform .18s,box-shadow .25s,border-color .25s}
.servicos a span.t{min-width:0}
.servicos a small{display:block;font-weight:500;font-size:10.5px;color:var(--tinta-2);margin-top:2px}
.servicos .ico{width:40px;height:40px;border-radius:12px;flex:none}
.servicos .ico svg{width:21px;height:21px}
.servicos a:active{transform:scale(.96)}
.servicos a:hover{border-color:var(--ouro);box-shadow:0 10px 24px rgba(142,110,62,.14)}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#FFF8EC,#F1E3C8);box-shadow:inset 0 0 0 1px rgba(176,141,87,.25),0 6px 14px rgba(142,110,62,.12)}
.ico svg{width:23px;height:23px}

nav{display:grid;gap:11px}
a.l{position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px 12px 12px;border-radius:20px;text-decoration:none;text-align:left;font-weight:700;font-size:15.5px;color:var(--tinta);background:var(--vidro);border:1px solid var(--borda);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(43,38,34,.04);transition:transform .18s,border-color .25s,box-shadow .25s;overflow:hidden}
a.l:active{transform:scale(.98)}
a.l:hover{border-color:var(--ouro);box-shadow:0 10px 26px rgba(142,110,62,.14)}
a.l:focus-visible,.servicos a:focus-visible,.acoes button:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
a.l .txt{flex:1}
a.l small{display:block;font-weight:500;font-size:12.5px;color:var(--tinta-2);margin-top:3px}
a.l .seta{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(176,141,87,.12);color:var(--ouro-e);transition:transform .2s}
a.l:hover .seta{transform:translateX(3px)}
a.l .seta svg{width:14px;height:14px}

/* botão principal: escuro, com um reflexo dourado que passa */
a.l.principal{background:linear-gradient(160deg,#2B2622,#1F1A17);color:var(--marfim);border-color:rgba(201,164,104,.4);box-shadow:0 16px 34px rgba(31,26,23,.28)}
a.l.principal small{color:rgba(244,235,221,.7)}
a.l.principal .seta{background:rgba(201,164,104,.18);color:#E3C88F}
a.l.principal:before{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,transparent,rgba(241,222,180,.22),transparent);transform:skewX(-18deg);animation:passa 4.5s ease-in-out infinite 1.4s}
a.l.principal .ico{background:linear-gradient(145deg,#2F8F5B,#25D366);box-shadow:0 6px 16px rgba(37,211,102,.3)}
.ico.wa svg{width:25px;height:25px}

.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.acoes a,.acoes button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:16px;border:1px solid var(--borda);background:var(--vidro);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font:600 13px Montserrat,system-ui,sans-serif;color:var(--tinta);text-decoration:none;cursor:pointer;transition:transform .18s,border-color .25s}
.acoes a:active,.acoes button:active{transform:scale(.97)}
.acoes svg{width:18px;height:18px;color:var(--ouro-e)}

.aviso{display:flex;gap:12px;align-items:flex-start;text-align:left;margin-top:24px;padding:14px 16px;border-radius:16px;background:rgba(255,252,247,.5);border:1px dashed rgba(176,141,87,.45);font-size:12.5px;line-height:1.5;color:var(--tinta-2)}
.aviso svg{width:22px;height:22px;flex:none;color:var(--ouro);margin-top:1px}
.aviso b{color:var(--tinta)}
.credito{font-family:Cormorant,Georgia,serif;font-weight:600;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;opacity:.5;margin-top:26px}
.credito:before{content:"";display:block;width:36px;height:1px;background:currentColor;opacity:.5;margin:0 auto 10px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;padding:11px 18px;border-radius:99px;background:var(--escuro);color:var(--marfim);font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* agenda: passos numerados, um embaixo do outro */
.topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.voltar{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 10px;border-radius:99px;border:1px solid var(--borda);background:var(--vidro);text-decoration:none;color:var(--tinta);font-weight:600;font-size:13px}
.voltar svg{width:16px;height:16px;color:var(--ouro-e)}
.mini{display:flex;align-items:center;gap:8px;font-family:Cormorant,Georgia,serif;font-weight:600;font-size:13px;letter-spacing:.2em}
.mini img{width:22px;height:auto}
h1.pagina{font-family:Cormorant,Georgia,serif;font-weight:500;font-size:clamp(34px,10vw,42px);line-height:1.05;white-space:normal;padding:0;margin:0;letter-spacing:.01em;text-wrap:balance}
.intro{font-size:14px;line-height:1.55;color:var(--tinta-2);margin:10px auto 22px;max-width:34ch}
#app{text-align:left;display:grid;gap:14px}
.passo{padding:18px 16px;border-radius:22px;background:var(--vidro);border:1px solid var(--borda);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pt{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:var(--papel);background:linear-gradient(145deg,#C9A468,#8E6E3E)}
.passo.ok .pn{background:var(--escuro)}
.pt h2{font-family:Cormorant,Georgia,serif;font-weight:600;font-size:22px;line-height:1.1;flex:1}
.pf{font-size:12.5px;font-weight:700;color:var(--ouro-e);max-width:50%;text-align:right}
.opcoes{display:grid;gap:9px}
.opcoes.profs{grid-template-columns:1fr 1fr}
.op{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--borda);background:var(--papel);text-align:left;cursor:pointer;font:inherit;color:var(--tinta);transition:transform .15s,border-color .2s}
.op b{font-weight:700;font-size:14.5px}
.op .ini{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Great Vibes',cursive;font-size:22px;color:var(--ouro-e);background:linear-gradient(150deg,#FFF8EC,#EAD7B4)}
.op.serv{flex-direction:column;align-items:flex-start;gap:2px}
.op.serv span{font-size:13px;font-weight:600;color:var(--ouro-e)}
.op.serv small{font-size:12px;color:var(--tinta-2)}
.op.sel,.chip.sel{border-color:var(--escuro);background:var(--escuro);color:var(--marfim)}
.op.sel span,.op.sel small{color:#E3C88F}
.op:active,.chip:active{transform:scale(.97)}
.op:focus-visible,.chip:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:72px;min-height:46px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--borda);background:var(--papel);font:700 15px Montserrat,system-ui,sans-serif;color:var(--tinta);cursor:pointer;transition:transform .15s}
.chip.dia{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.chip.dia b{font-size:14px}
.chip.dia small{font-size:11.5px;font-weight:500;opacity:.8}
form label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}
form input{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--borda);background:var(--papel);font:500 16px Montserrat,system-ui,sans-serif;color:var(--tinta)}
form input:focus{outline:none;border-color:var(--ouro)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin-top:16px;border:0;border-radius:16px;font:700 15.5px Montserrat,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.forte{background:linear-gradient(160deg,#2B2622,#1F1A17);color:var(--marfim);box-shadow:0 12px 28px rgba(31,26,23,.25)}
.btn[disabled]{opacity:.6}
.nota{font-size:12px;color:var(--tinta-2);margin-top:10px;text-align:center}
.aviso{display:block;text-align:left;margin-top:12px;padding:12px 14px;border-radius:14px;background:#FBF0DF;border:1px solid rgba(176,141,87,.4);font-size:13.5px;line-height:1.5}
.aviso a,.vazio a{color:var(--ouro-e);font-weight:700}
.vazio{font-size:14px;color:var(--tinta-2);line-height:1.5}
.link{display:block;margin:12px auto 0;background:none;border:0;font:600 13px Montserrat,system-ui,sans-serif;color:var(--ouro-e);text-decoration:underline;cursor:pointer;text-align:center}
.cartao-msg{text-align:center;padding:26px 20px;border-radius:24px;background:var(--vidro);border:1px solid var(--borda)}
.cartao-msg b{display:block;font-family:Cormorant,Georgia,serif;font-size:26px;font-weight:600;margin-bottom:8px}
.cartao-msg p{font-size:14px;line-height:1.55;color:var(--tinta-2);margin-top:6px}
.cartao-msg p b{display:inline;font-family:inherit;font-size:inherit;font-weight:700;color:var(--tinta)}
.selo-ok{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:var(--papel);background:linear-gradient(145deg,#C9A468,#8E6E3E)}

@keyframes entra{to{opacity:1;transform:none}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(176,141,87,.55)}70%{box-shadow:0 0 0 9px rgba(176,141,87,0)}100%{box-shadow:0 0 0 0 rgba(176,141,87,0)}}
@keyframes pisca{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
@keyframes reflexo{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@keyframes passa{0%{left:-70%}55%,100%{left:130%}}
@keyframes flutua{to{transform:translate(40px,30px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.entra{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="fundo" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <div class="topo">
    <a class="voltar" href="../links/" id="voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Voltar</a>
    <span class="mini"><img src="../img/simbolo.svg" alt="" width="651" height="780">STUDIO LA ROCHA</span>
  </div>
  <h1 class="pagina">Agende seu horário</h1>
  <p class="intro">Escolha com quem, o serviço, o dia e a hora. Leva menos de um minuto.</p>
  <div id="app" aria-live="polite"><p class="vazio">Carregando os horários…</p></div>
  <p class="aviso" style="margin-top:22px;display:block;text-align:center"><b>Pagamento só no salão.</b> Nunca pedimos Pix ou sinal por mensagem.</p>
  <p class="credito">Desenvolvido por Kevin Laet</p>
</main>
<script src="../config.js"></script>
<script src="agenda.js"></script>
</body>
</html>

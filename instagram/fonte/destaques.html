<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Capas dos destaques</title>
<style>
  :root{--escuro:#1F1A17;--ouro:#C9A468;--ouro-e:#8E6E3E;--marfim:#F4EBDD}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#888}
  /* 1080x1920; o Instagram mostra só um círculo no centro (~ 1080 de largura): o ícone fica bem no meio */
  .capa{position:relative;width:1080px;height:1920px;margin:0 0 30px;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(900px 900px at 50% 50%,#3A2F27 0%,var(--escuro) 70%)}
  .capa:before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;border:3px solid rgba(201,164,104,.55)}
  .capa:after{content:"";position:absolute;width:690px;height:690px;border-radius:50%;border:1.5px solid rgba(201,164,104,.28)}
  svg{position:relative;width:340px;height:340px;fill:none;stroke:var(--ouro);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<section class="capa" id="servicos"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.6"/><circle cx="6" cy="17" r="2.6"/><path d="M8.2 8.4L20 16M8.2 15.6L20 8"/></svg></section>
<section class="capa" id="precos"><svg viewBox="0 0 24 24"><path d="M20.6 13.4L13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></section>
<section class="capa" id="chegar"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></section>
<section class="capa" id="agendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8.5 15.5l2.2 2.2 4.3-4.4"/></svg></section>
<section class="capa" id="antes"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="8.5" height="14" rx="2"/><rect x="13" y="5" width="8.5" height="14" rx="2"/><path d="M5 15.5l2-2.5 1.6 1.8M15.5 15.5l1.8-2.6 2.2 2.6"/></svg></section>
<section class="capa" id="equipe"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5"/><circle cx="16.5" cy="9" r="3"/><path d="M1.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M14.5 14.6c3.4-.6 6.4 1.2 7.5 5.4"/></svg></section>
<section class="capa" id="regras"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg></section>
</body></html>

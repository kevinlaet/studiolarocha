<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Story · Sobrou um horário</title><style>
@font-face{font-family:"Cormorant";src:url(cormorant.woff2) format("woff2");font-weight:300 700}
@font-face{font-family:"Great Vibes";src:url(greatvibes.woff2) format("woff2")}
@font-face{font-family:"Montserrat";src:url(montserrat.woff2) format("woff2");font-weight:100 900}
:root{--creme:#F7F1E8;--papel:#FFFCF7;--ouro:#B08D57;--ouro-c:#D9BC86;--bronze:#9C7A45;--tinta:#2B2622;--tinta-2:#6A6058;--escuro:#1F1A17}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777}
#ult{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--creme);font-family:Montserrat;color:var(--tinta)}
.foto{position:absolute;left:0;right:0;top:0;height:960px;background:url(foto-serum.jpg) center 35%/cover;filter:saturate(.8) sepia(.12)}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,241,232,.0) 55%,rgba(247,241,232,.85) 85%,#F7F1E8 100%)}
.marca{position:absolute;top:250px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:14px 26px;border-radius:99px;background:rgba(255,252,247,.82);backdrop-filter:blur(6px);font-family:Cormorant;font-weight:600;font-size:24px;letter-spacing:.26em;white-space:nowrap}
.marca img{height:40px}
.ticket{position:absolute;left:100px;right:100px;top:640px;background:var(--papel);border-radius:44px;padding:54px 60px 48px;box-shadow:0 40px 90px rgba(43,38,34,.18),0 0 0 1.5px rgba(176,141,87,.28)}
.ticket::before,.ticket::after{content:"";position:absolute;top:381px;width:56px;height:56px;border-radius:50%;background:var(--creme);box-shadow:inset 0 0 0 1.5px rgba(176,141,87,.28)}
.ticket::before{left:-28px}.ticket::after{right:-28px}
.rot{font-weight:700;font-size:24px;letter-spacing:.34em;text-transform:uppercase;color:var(--bronze);text-align:center}
h1{margin-top:18px;text-align:center;font-family:Cormorant;font-weight:500;font-size:128px;line-height:.98}
h1 em{font-style:normal;font-family:"Great Vibes";font-weight:400;padding:0 .06em;background:linear-gradient(100deg,#8E6E3E,#B08D57 45%,#C9A468 60%,#8E6E3E);-webkit-background-clip:text;background-clip:text;color:transparent}
.corte{margin:44px -60px 0;border-top:2.5px dashed rgba(176,141,87,.4)}
.info{margin-top:40px;display:grid;grid-template-columns:1.15fr 1fr 1fr;text-align:center}
.info div+div{border-left:1.5px solid rgba(176,141,87,.25)}
.info small{display:block;font-weight:700;font-size:20px;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze)}
.info b{display:block;margin-top:10px;font-family:Cormorant;font-weight:600;font-size:76px;line-height:1;font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums;white-space:nowrap}
.info span{display:block;margin-top:6px;font-size:22px;color:var(--tinta-2)}
.nota{margin-top:40px;text-align:center;font-size:30px;line-height:1.45;color:var(--tinta-2)}
.nota b{color:var(--tinta);font-weight:700}
.alvo{position:absolute;left:50%;transform:translateX(-50%);bottom:380px;width:760px;height:120px;border-radius:99px;border:2px dashed rgba(176,141,87,.45);display:grid;place-items:center;text-align:center;font-size:20px;line-height:1.45;color:rgba(156,122,69,.6)}
.alvo em{font-style:normal;font-weight:700}
</style></head><body>
<section id="ult">
  <div class="foto"></div>
  <div class="marca"><img src="simbolo-colorido.svg" alt="">STUDIO LA ROCHA</div>
  <div class="ticket">
    <div class="rot">Limpeza de pele</div>
    <h1>Sobrou <em>um</em> horário</h1>
    <div class="corte"></div>
    <div class="info">
      <div><small>Dia</small><b>12/12</b><span>sábado</span></div>
      <div><small>Hora</small><b>18h20</b><span>até 20h10</span></div>
      <div><small>Valor</small><b>R$ 75</b><span>inauguração</span></div>
    </div>
    <p class="nota">É o último do ano. <b>O próximo, só em janeiro.</b></p>
  </div>
  <div class="alvo"><span>Cole aqui a figurinha <em>LINK</em> (texto “Quero esse horário”)<br>studiolarocha.com.br/agenda/?p=amanda</span></div>
</section>
</body></html>
